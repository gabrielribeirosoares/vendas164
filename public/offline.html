<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <title>Sem conexão — Vendas 1:64</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #111827; color: #f8fafc; }
      main { width: min(100%, 420px); text-align: center; padding: 32px; border: 1px solid #334155; border-radius: 24px; background: #1f2937; box-shadow: 0 24px 60px rgb(0 0 0 / 35%); }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 { margin: 20px 0 8px; font-size: 24px; }
      p { margin: 0; color: #cbd5e1; line-height: 1.6; }
      button { margin-top: 24px; min-height: 44px; border: 0; border-radius: 12px; padding: 0 20px; background: #7c3aed; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/pwa-icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para consultar produtos, reservas e dados atualizados da sua loja.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
